<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint Department Queue</title>
<style>
  :root{
    --bg:#F3F4F6;
    --panel:#FFFFFF;
    --panel-2:#F8F9FA;
    --line:#D9DEE5;
    --ink:#20262E;
    --ink-dim:#667085;
    --ink-faint:#8A94A3;
    --waiting:#667085;
    --serving:#5CB87A;
    --serving-bg:#ECFDF3;
    --completed:#2563EB;
    --skipped:#D97706;
    --danger:#DC3B3B;
    --focus:#E5A900;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  /* ---------- Desktop-only gate ---------- */
  #mobileGate{
    display:none; min-height:100vh; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; padding:40px 24px;
  }
  #mobileGate .icon{font-size:44px; margin-bottom:14px;}
  #mobileGate h2{margin:0 0 8px; font-size:19px;}
  #mobileGate p{margin:0; color:var(--ink-dim); font-size:14px; max-width:340px; line-height:1.6;}

  /* ---------- Daily reset toast ---------- */
  .daily-reset-toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-14px);
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px;
    font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.18);
    z-index:999; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    max-width:90vw; text-align:center;
  }
  .daily-reset-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .action-toast{background:#15803D; display:flex; align-items:center; gap:10px;}
  .action-toast .toast-undo{background:transparent; border:1px solid rgba(255,255,255,.5); color:#fff; padding:5px 11px; border-radius:7px; font-size:12.5px; cursor:pointer; flex-shrink:0;}
  .action-toast .toast-undo:hover{background:rgba(255,255,255,.15);}

  /* ---------- App shell ---------- */
  .app{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .brandmark{display:flex; align-items:center; gap:12px;}
  .brandmark .chip{
    width:38px;height:38px;border-radius:8px;
    background:conic-gradient(from 210deg,#E8542A,#1F5FA8,#2E8B57,#C81E3A,#6A3FA0,#F2A900,#17A6A0,#E8542A);
    flex-shrink:0;
  }
  .brandmark h1{font-size:17px; margin:0; letter-spacing:.2px;}
  .brandmark p{margin:2px 0 0; font-size:12.5px; color:var(--ink-faint);}

  .top-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  select.role-select{
    background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    padding:8px 10px; border-radius:8px; font-size:13px;
  }

  nav.tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
  nav.tabs button{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:8px 14px; border-radius:20px; font-size:13.5px; cursor:pointer;
  }
  nav.tabs button.active{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600;}
  nav.tabs button:disabled{opacity:.35; cursor:not-allowed;}

  /* ---------- Dashboard stat strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:12px; color:var(--ink-faint); margin-top:2px;}

  /* ---------- Currently serving ---------- */
  section.serving-row{margin-bottom:26px;}
  h2.section-title{font-size:13px; text-transform:none; color:var(--ink-dim); font-weight:600; margin:0 0 10px;}
  .serving-cards{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;}
  .serving-card{
    min-width:210px; background:var(--serving-bg); border:1px solid #3C5836;
    border-radius:var(--radius); padding:14px 16px; flex-shrink:0;
  }
  .serving-card .qno{font-size:26px; font-weight:700; letter-spacing:.5px;}
  .serving-card .brandline{display:flex; align-items:center; gap:8px; margin:6px 0 10px; font-size:13.5px; color:var(--ink-dim);}
  .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .serving-card .who{font-size:14.5px; color:var(--ink); font-weight:600; margin-bottom:2px;}
  .serving-card .since{font-size:12px; color:var(--ink-faint); margin-bottom:12px;}
  .btn-complete{
    width:100%; background:var(--serving); color:#12210F; border:none;
    padding:10px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-complete:active{transform:scale(.98);}
  .empty-note{color:var(--ink-faint); font-size:13.5px; padding:10px 2px;}

  /* ---------- Board lower area: waiting queue + recent activity ---------- */
  .board-lower{display:flex; gap:16px; align-items:flex-start;}
  .board-lower .waiting-section{flex:2; min-width:0;}
  .recent-activity{flex:1; min-width:170px; max-width:340px; margin-bottom:28px;}
  .activity-list{display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto; padding-right:2px;}
  .activity-item{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:var(--radius); padding:10px 12px; font-size:12.5px;}
  .activity-item .a-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:3px;}
  .activity-item .a-who{display:flex; align-items:baseline; gap:6px; min-width:0;}
  .activity-item .a-actor{font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .activity-item .a-action{font-weight:600; white-space:nowrap;}
  .activity-item .a-time{color:var(--ink-faint); font-size:11px; white-space:nowrap; flex-shrink:0;}
  .activity-item .a-detail{color:var(--ink-dim); line-height:1.4;}
  /* ---- Recent-activity color coding by action type ---- */
  .activity-item.act-create{border-left-color:#475569;}
  .activity-item.act-create .a-action{color:#475569;}
  .activity-item.act-serving{border-left-color:var(--serving);}
  .activity-item.act-serving .a-action{color:#15803d;}
  .activity-item.act-done{border-left-color:var(--completed);}
  .activity-item.act-done .a-action{color:var(--completed);}
  .activity-item.act-return{border-left-color:#7C3AED;}
  .activity-item.act-return .a-action{color:#7C3AED;}
  .activity-item.act-skip{border-left-color:var(--skipped);}
  .activity-item.act-skip .a-action{color:var(--skipped);}
  .activity-item.act-cancel{border-left-color:var(--danger);}
  .activity-item.act-cancel .a-action{color:var(--danger);}
  .activity-item.act-edit{border-left-color:var(--focus);}
  .activity-item.act-edit .a-action{color:var(--focus);}
  .activity-item.act-swap{border-left-color:#0891B2;}
  .activity-item.act-swap .a-action{color:#0891B2;}
  .activity-item.act-admin{border-left-color:#94A3B8;}
  .activity-item.act-admin .a-action{color:#64748B;}

  /* ---------- History: all actions of the day ---------- */
  .haction-item{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #cbd5e1;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(15,23,42,.03);}
  .haction-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .haction-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .haction-actor{font-weight:700;color:var(--ink);font-size:13.5px;}
  .haction-action{font-weight:700;font-size:13px;}
  .haction-time{color:var(--ink-faint);font-size:12px;flex-shrink:0;}
  .haction-detail{color:var(--ink-dim);font-size:12.5px;margin-top:5px;line-height:1.5;}
  .haction-badge{font-size:11px;font-weight:700;background:#f1f5f9;color:#475569;border-radius:6px;padding:2px 8px;}
  .haction-foot{display:flex;justify-content:flex-end;margin-top:8px;}
  .haction-item.act-create{border-left-color:#475569;} .haction-item.act-create .haction-action{color:#475569;}
  .haction-item.act-serving{border-left-color:var(--serving);} .haction-item.act-serving .haction-action{color:#15803d;}
  .haction-item.act-done{border-left-color:var(--completed);} .haction-item.act-done .haction-action{color:var(--completed);}
  .haction-item.act-return{border-left-color:#7C3AED;} .haction-item.act-return .haction-action{color:#7C3AED;}
  .haction-item.act-skip{border-left-color:var(--skipped);} .haction-item.act-skip .haction-action{color:var(--skipped);}
  .haction-item.act-cancel{border-left-color:var(--danger);} .haction-item.act-cancel .haction-action{color:var(--danger);}
  .haction-item.act-edit{border-left-color:var(--focus);} .haction-item.act-edit .haction-action{color:#946200;}
  .haction-item.act-swap{border-left-color:#0891B2;} .haction-item.act-swap .haction-action{color:#0891B2;}
  .haction-item.act-admin{border-left-color:#94A3B8;} .haction-item.act-admin .haction-action{color:#64748B;}
  .history-day-count{font-weight:400;color:var(--ink-faint);}
  @media (max-width:760px){
    .board-lower{flex-direction:column;}
    .recent-activity{width:100%; max-width:none;}
  }

  /* ---------- Waiting queue ---------- */
  section.waiting-section{margin-bottom:28px;}
  .waiting-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .waiting-head-left{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .waiting-head-right{display:flex; align-items:center; gap:8px;}
  .select-all-wrap{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim); cursor:pointer; user-select:none;}
  .btn-bulk-mode{background:transparent; color:var(--ink-dim); border:1px solid var(--line); padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-bulk-mode:hover{border-color:var(--ink-dim);}
  .btn-bulk-cancel{background:var(--danger); color:#fff; border:none; padding:9px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-bulk-cancel:disabled{opacity:.4; cursor:not-allowed;}
  .waiting-list{display:flex; flex-direction:column; gap:8px;}
  .wrow{
    display:grid; grid-template-columns:64px 1fr 90px auto; align-items:center;
    gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px;
  }
  .wrow.wrow-bulk{grid-template-columns:22px 64px 1fr 90px auto;}
  .wrow.wrow-selected{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset;}
  .wrow .wchk{width:16px; height:16px; cursor:pointer; accent-color:var(--danger);}
  .wrow .qno{font-weight:700; font-size:20px;}
  .wrow .mid{display:flex; align-items:center; gap:10px; min-width:0;}
  .wrow .staffname{font-size:14.5px; color:var(--ink); font-weight:600;}
  .wrow .brandname{font-size:12.5px; color:var(--ink-faint);}
  .wrow .time{font-size:12.5px; color:var(--ink-faint); text-align:right;}
  .wrow-actions{display:flex; gap:6px;}
  .btn-call{background:var(--ink); color:var(--bg); border:none; padding:8px 12px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-skip{background:transparent; color:var(--skipped); border:1px solid var(--skipped); padding:8px 10px; border-radius:7px; font-size:12.5px; cursor:pointer;}

  /* ---------- Modal ---------- */
  .modal-backdrop{

    position:fixed; inset:0; background:rgba(15,23,42,.42); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    width:100%; max-width:460px; padding:22px; max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal .step-note{color:var(--ink-faint); font-size:12.5px; margin-bottom:16px;}
  .grid-pick{display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:52vh; overflow-y:auto; padding-right:2px;}
  .pick-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    border-radius:9px; padding:14px 10px; font-size:14px; cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:8px;
  }
  .pick-btn:hover{border-color:var(--ink-dim);}
  .pick-btn.locked{opacity:.4; cursor:not-allowed;}
  .pick-btn .staff-brand{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-primary{flex:1; background:var(--focus); color:#231B05; border:none; padding:12px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px;}
  .btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line); padding:12px 16px; border-radius:8px; cursor:pointer; font-size:14px;}
  .confirm-summary{background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:14px; margin-top:6px;}
  .confirm-summary div{font-size:13.5px; color:var(--ink-dim); margin-bottom:4px;}
  .confirm-summary strong{color:var(--ink);}
  .error-msg{color:var(--danger); font-size:13px; margin-top:8px; min-height:16px;}
  .success-ticket{text-align:center; padding:10px 0;}
  .success-ticket .bignum{font-size:44px; font-weight:700; margin:10px 0 2px;}
  .success-ticket .subline{color:var(--ink-faint); font-size:13px;}

  /* ---------- History / audit ---------- */
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .toolbar input, .toolbar select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:9px 11px; border-radius:8px; font-size:13px;
  }
  table.hist{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.hist th{text-align:left; color:var(--ink-faint); font-weight:600; font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line);}
  table.hist td{padding:9px 10px; border-bottom:1px solid var(--line);}
  .status-pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .status-pill.WAITING{background:#EEF1F4; color:var(--waiting);}
  .status-pill.SERVING{background:#ECFDF3; color:#15803D;}
  .status-pill.COMPLETED{background:#EFF6FF; color:var(--completed);}
  .status-pill.SKIPPED{background:#FFF7ED; color:var(--skipped);}
  .status-pill.DELETED{background:#FEF2F2; color:var(--danger);}
  .btn-log{background:transparent; color:var(--focus); border:1px solid var(--focus); padding:6px 9px; border-radius:7px; font-size:11.5px; cursor:pointer;}

  .audit-line{font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--line); color:var(--ink-dim);}
  .audit-line .ts{color:var(--ink-faint); margin-right:8px;}

  /* ---------- Admin ---------- */
  .admin-cols{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .admin-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .admin-card h3{margin:0 0 12px; font-size:14px;}
  .admin-item{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .admin-item .del{background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px;}
  .admin-add{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .admin-add input, .admin-add select{flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:9px 10px; border-radius:7px; font-size:13px; min-width:100px;}
  .admin-add button{background:var(--ink); color:var(--bg); border:none; padding:9px 12px; border-radius:7px; font-size:13px; cursor:pointer; font-weight:600;}


  .btn-board-add{background:var(--focus);color:#2B2205;border:none;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,.12);}
  .btn-board-add:hover{filter:brightness(.98);}
  .btn-board-add:disabled{opacity:.45;cursor:not-allowed;}
  .admin-danger{margin-top:20px;border:1px solid #F2B8B5;background:#FFF8F7;}
  .settings-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:18px;cursor:pointer;}
  .settings-toggle-copy{flex:1;}
  .settings-toggle-title{font-weight:700;font-size:14.5px;color:var(--ink);}
  .settings-toggle-wrap{position:relative;display:inline-block;width:46px;height:27px;flex-shrink:0;}
  .settings-toggle-wrap input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .settings-toggle-switch{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:background .15s;}
  .settings-toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .settings-toggle-wrap input:checked + .settings-toggle-switch{background:#15803D;}
  .settings-toggle-wrap input:checked + .settings-toggle-switch::after{transform:translateX(19px);}
  .admin-danger h3{color:var(--danger);}
  .btn-reset{background:var(--danger);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}

  @media (max-width:900px){
    .app{display:none;}
    #mobileGate{display:flex;}
  }
.cancel-reason{display:inline-block;max-width:260px;white-space:normal;line-height:1.45;color:var(--danger);font-weight:600;}

/* ===== UI/UX LIGHT REFRESH ===== */
:root{--bg:#f5f7fa;--panel:#ffffff;--panel-2:#f8fafc;--ink:#172033;--ink-dim:#475569;--ink-faint:#64748b;--line:#e2e8f0;--focus:#2563eb;--radius:14px;}
body{background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);color:var(--ink);}
.app{max-width:1440px;margin:auto;}
header{background:#fff!important;border-bottom:1px solid #e5e7eb!important;box-shadow:0 2px 12px rgba(15,23,42,.05);}
.card,.board-card,.admin-card,.history-card{background:#fff!important;border:1px solid #e2e8f0!important;border-radius:16px!important;box-shadow:0 4px 18px rgba(15,23,42,.045);}
.section-title{letter-spacing:.02em;}
.btn-board-add{background:#2563eb!important;color:#fff!important;border-radius:12px!important;box-shadow:0 5px 14px rgba(37,99,235,.18)!important;}
.btn-board-add:hover{transform:translateY(-1px);}
.status-pill{padding:5px 10px!important;border:1px solid rgba(15,23,42,.06);}
table.hist th{background:#f8fafc;position:sticky;top:0;z-index:1;}
table.hist td{padding:12px 10px!important;vertical-align:middle;}
table.hist tr:hover td{background:#f8fafc;}
.toolbar{background:#fff;border:1px solid var(--line);padding:10px;border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,.03);}
.toolbar input,.toolbar select{background:#fff!important;min-height:40px;}
.audit-line{display:grid;grid-template-columns:90px 150px 110px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:11px 13px;margin-bottom:7px;box-shadow:0 2px 8px rgba(15,23,42,.025);}
.audit-line .ts{margin:0;font-weight:700;color:#334155;}
.audit-line strong{color:#0f172a;}
.audit-line .mono{color:#475569;}
@media(max-width:900px){.audit-line{grid-template-columns:1fr 1fr;}}
/* history readability */
.history-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.history-summary .mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--ink-dim)}
.history-summary b{font-size:17px;color:var(--ink);margin-right:4px}
@media(max-width:1100px){table.hist{font-size:13px}table.hist th,table.hist td{padding:9px 7px!important}}

.reason-select{width:100%;margin-top:8px;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;font-family:inherit;font-size:13.5px;}
.btn-export{margin-left:auto;background:#fff;color:#2563eb;border:1px solid #93c5fd;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-export:hover{background:#eff6ff;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.success-state{text-align:center;padding:12px 0 4px;}
.success-icon{width:58px;height:58px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:32px;font-weight:800;border:1px solid #86efac;}
.success-state h3{margin:0 0 6px;font-size:18px;color:#166534;}

<body>

<div id="mobileGate">
  <div class="icon">🖥️</div>
  <h2>ใช้งานได้เฉพาะคอมกลางของแผนก</h2>
  <p>ระบบคิวนี้ออกแบบสำหรับหน้าจอเดสก์ท็อป/แท็บเล็ตกลางของแผนกเท่านั้น เพื่อป้องกันการลงคิวจากมือถือส่วนตัว กรุณาเปิดผ่านคอมกลางแทน</p>
</div>

<div id="dailyResetToast" class="daily-reset-toast"></div>
<div id="actionToast" class="daily-reset-toast action-toast"></div>

<div class="app">

  <header class="top">
    <div class="brandmark">
      <div class="chip"></div>
      <div>
        <h1>PAINT DEPARTMENT QUEUE</h1>
        <p>มาก่อน = ได้คิวก่อน · คอมกลาง = จุดสร้างคิว</p>
      </div>
    </div>
    <div class="top-controls">
      <select id="roleSelect" class="role-select" title="จำลองสิทธิ์"></select>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="viewRoot"></div>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* =========================================================
   STATE — localStorage-backed. Prototype only; production
   needs a real backend, auth, and a shared server clock.
   ========================================================= */
const LS_KEY = "pdq_state_v2";

const DEFAULT_BRANDS = [
  {id:"nippon",   name:"Nippon",   color:"#C81E3A"},
  {id:"toa",      name:"TOA",      color:"#E8542A"},
  {id:"beger",    name:"BEGER",    color:"#2E8B57"},
  {id:"captain",  name:"Captain",  color:"#F2A900"},
  {id:"jotun",    name:"Jotun",    color:"#1F5FA8"},
  {id:"dulux",    name:"Dulux",    color:"#6A3FA0"},
  {id:"delta",    name:"DELTA",    color:"#17A6A0"},
  {id:"jbp",      name:"JBP",      color:"#8B5E34"},
  {id:"woodtect", name:"Woodtect", color:"#6B7A3A"},
];

const DEFAULT_STAFF = [
  {id:"s1",  name:"โอม",    brandId:"nippon"},
  {id:"s2",  name:"ฝน",     brandId:"nippon"},
  {id:"s3",  name:"ไก่",    brandId:"toa"},
  {id:"s4",  name:"ฮันนี่", brandId:"toa"},
  {id:"s5",  name:"เอฟ",    brandId:"toa"},
  {id:"s6",  name:"อาร์ม",  brandId:"beger"},
  {id:"s7",  name:"เฟรม",   brandId:"beger"},
  {id:"s8",  name:"แบงค์",  brandId:"captain"},
  {id:"s9",  name:"มุก",    brandId:"captain"},
  {id:"s10", name:"บ๋อม",   brandId:"jotun"},
  {id:"s11", name:"แบล็ก",  brandId:"dulux"},
  {id:"s12", name:"เบนซ์",  brandId:"delta"},
  {id:"s13", name:"เต้",    brandId:"delta"},
  {id:"s14", name:"เอื้อย", brandId:"jbp"},
  {id:"s15", name:"ใหม่",   brandId:"jbp"},
  {id:"s16", name:"ก้อย",   brandId:"woodtect"},
];

/* Rule §14 — Daily Queue Reset key. Uses the DEVICE's local calendar day
   (YYYY-MM-DD), never a user-entered value, per Rule §4. */
function todayKey(ts){
  const d = ts ? new Date(ts) : new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function freshState(){
  return {
    brands: DEFAULT_BRANDS.map(b=>({...b})),
    staff: DEFAULT_STAFF.map(s=>({...s})),
    seqCounter: 0,
    queues: [],
    audit: [],
    lastActiveDate: todayKey(),
    settings: { autoRequeue: false },
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(!parsed.brands || !parsed.staff) return freshState();
    if(typeof parsed.seqCounter !== "number") parsed.seqCounter = 0;
    // Older saved states (before Rule §14) won't have this field yet.
    // Stamp it with today rather than forcing a reset on the very next
    // load — a real day-change will still be caught on its own next load.
    if(typeof parsed.lastActiveDate !== "string") parsed.lastActiveDate = todayKey();
    // Older saved states won't have a settings object yet either.
    if(!parsed.settings || typeof parsed.settings !== "object") parsed.settings = { autoRequeue:false };
    if(typeof parsed.settings.autoRequeue !== "boolean") parsed.settings.autoRequeue = false;
    return parsed;
  }catch(e){ return freshState(); }
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

let state = loadState();

/* =========================================================
   RULE §14 — DAILY QUEUE RESET (fully automatic, no button)
   ---------------------------------------------------------
   On every load, and periodically while the app stays open,
   compare the device's current calendar day against the day
   the state was last active on:
     - same day  → do nothing.
     - new day   → any queue still WAITING/SERVING from the
                    previous day is closed out (status→DELETED,
                    same anti-fraud trail as a manual cancel:
                    priorStatus kept, changeLog entry, audit
                    entry), seqCounter resets to 0 so the first
                    queue of the new day is #1, and the new day
                    is stamped as lastActiveDate.
   History and the Audit Log rows are NEVER deleted here — only
   the WAITING/SERVING pointer status changes, so nothing from
   yesterday can resurface on the live board, but it stays fully
   visible/exportable under History / Audit for later review.
   ========================================================= */
function performDailyResetIfNeeded(){
  const today = todayKey();
  if(state.lastActiveDate === today) return null;

  const previousDate = state.lastActiveDate || 'ก่อนหน้า';
  let carried = 0;
  state.queues.forEach(q=>{
    if(q.status==="WAITING" || q.status==="SERVING"){
      carried++;
      const before = { status: q.status };
      q.priorStatus = q.status;
      q.status = "DELETED";
      q.deletedAt = nowTs();
      q.deletedBy = "System";
      q.deleteReason = `ปิดคิวอัตโนมัติเมื่อเปลี่ยนวัน (${previousDate} → ${today})`;
      addChangeLog(q, "System", "ปิดวันอัตโนมัติ", before, {status:"DELETED"}, q.deleteReason);
    }
  });
  state.seqCounter = 0;
  state.lastActiveDate = today;
  logAudit(
    "System",
    "รีเซ็ตคิวประจำวัน (อัตโนมัติ)",
    `วันที่เปลี่ยนจาก ${previousDate} เป็น ${today} — ปิดคิวที่ยังไม่จบ ${carried} คิว และเริ่มเลขคิวใหม่จาก 1 (ประวัติและ Audit Log เดิมยังคงเก็บไว้ครบ ไม่ถูกลบ)`
  );
  saveState();
  return {previousDate, today, carried};
}

/* small toast so staff know the board just auto-reset for a new day —
   otherwise the board quietly emptying could look like a bug */
function showDailyResetToast(info){
  const el = document.getElementById('dailyResetToast');
  if(!el || !info) return;
  el.textContent = `📅 เริ่มวันใหม่ (${dateLabelTH(Date.now())}) — ระบบรีเซ็ตคิวอัตโนมัติ เริ่มนับคิวใหม่จาก 1${info.carried?` · ปิดคิวเมื่อวานที่ยังไม่จบ ${info.carried} คิว`:''}`;
  el.classList.add('show');
  clearTimeout(showDailyResetToast._t);
  showDailyResetToast._t = setTimeout(()=>el.classList.remove('show'), 7000);
}

/* current simulated session — role only. Device is detected for real (see isMobileDevice). */
let session = {
  role: "STAFF",          // STAFF | SUPERVISOR | ADMIN
  tab: "board",
};

/* Rule §1/§10 — this is a REAL device check (viewport + user-agent), not a toggle.
   The CSS media query already hides the whole app under 900px; this JS check is the
   belt-and-braces guard for any write action, so nothing here can be tricked into
   allowing a queue action from a phone. */
function isMobileDevice(){
  const uaMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  const narrow = window.innerWidth < 900;
  return uaMobile || narrow;
}
function canWrite(){ return !isMobileDevice(); }
function isSupervisorPlus(){ return session.role==="STAFF" || session.role==="ADMIN"; }
function canCancelQueue(q){ return session.role==="ADMIN" || session.role==="SUPERVISOR" || session.role==="STAFF"; }
function isAdmin(){ return session.role==="ADMIN"; }

/* =========================================================
   HELPERS
   ========================================================= */
function uid(){ return Math.random().toString(36).slice(2,10); }
function nowTs(){ return Date.now(); } // Rule §4: server/device time only, never user-entered
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function fmtClock(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function fmtDuration(ms){
  const s = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(s/60), r = s%60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function brandById(id){ return state.brands.find(b=>b.id===id); }
function staffById(id){ return state.staff.find(s=>s.id===id); }

// Maps an audit "action" label to a CSS class so Recent Activity rows
// are color-coded by action type instead of all sharing one accent color.
function actionClass(action){
  switch(action){
    case 'สร้างคิว': return 'act-create';
    case 'เริ่มบริการ': return 'act-serving';
    case 'จบ': return 'act-done';
    case 'คืนคิว': return 'act-return';
    case 'ข้ามคิว': return 'act-skip';
    case 'ยกเลิกคิว': return 'act-cancel';
    case 'แก้ไขคิว': return 'act-edit';
    case 'แทนคิว (สลับชั่วคราว)':
    case 'แทนคิว': return 'act-swap';
    default: return 'act-admin'; // ตั้งค่า / เพิ่ม-ลบแบรนด์ / เพิ่ม-ลบพนักงาน / รีเซ็ตคิว
  }
}

function logAudit(actorName, action, detail, queueId){
  state.audit.unshift({ ts: nowTs(), actor: actorName, action, detail, queueId: queueId||null });
  // History/audit must never be discarded (Rule §5) — no trimming of this array.
}

/* Rule §3: a staff member cannot hold more than one active (WAITING or SERVING) queue */
function staffHasActiveQueue(staffId){
  return state.queues.some(q => q.staffId===staffId && (q.status==="WAITING"||q.status==="SERVING"));
}

/* Rule §13/§2 (updated): one plain running sequence number, in strict arrival order,
   shared across all brands — not a per-brand prefixed code. Never editable. */
function nextSeq(){
  state.seqCounter += 1;
  return state.seqCounter;
}

function createQueue(staffId, auto){
  const staff = staffById(staffId);
  if(!staff) return {ok:false, msg:"ข้อมูลไม่ถูกต้อง"};
  const brand = brandById(staff.brandId);
  if(staffHasActiveQueue(staffId)) return {ok:false, msg:`⚠️ ${staff.name} มีคิวที่ยังไม่จบ — ต้องกด "จบคิว" ก่อน`};
  const q = {
    id: uid(),
    seq: nextSeq(),
    brandId: staff.brandId, staffId,
    status: "WAITING",
    createdAt: nowTs(),
    calledAt: null, calledBy: null,
    completedAt: null,
  };
  state.queues.push(q);
  logAudit(staff.name, "สร้างคิว", `ลำดับ ${q.seq} → ${brand?.name||'-'}${auto?' (ลงอัตโนมัติหลังจบงาน)':''}`, q.id);
  saveState();
  return {ok:true, queue:q};
}

function callQueue(queueId, callerName){
  const q = state.queues.find(x=>x.id===queueId);
  if(!q || q.status!=="WAITING") return;
  q.status = "SERVING";
  q.calledAt = nowTs();
  q.calledBy = callerName;
  logAudit(staffById(q.staffId)?.name || callerName, "เริ่มบริการ", `ลำดับ ${q.seq}`, q.id);
  saveState();
}

function completeQueue(queueId, actorName){
  const q = state.queues.find(x=>x.id===queueId);
  if(!q || q.status!=="SERVING") return;
  q.status = "COMPLETED";
  q.completedAt = nowTs();
  logAudit(actorName, "จบ", `ลำดับ ${q.seq}`, q.id);
  saveState();
}

/* Undo for an accidental "ขึ้นคิว" tap: sends a SERVING queue back to
   WAITING with its original seq intact, so it reappears in the exact
   same position in the waiting list. No reason required since this is
   just correcting a slip, but it is still logged for traceability. */
function returnQueueToWaiting(queueId, actorName){
  const q = state.queues.find(x=>x.id===queueId);
  if(!q || q.status!=="SERVING") return {ok:false, msg:"ไม่พบคิวที่กำลังบริการ"};
  const before = { status:q.status, calledAt:q.calledAt, calledBy:q.calledBy };
  q.status = "WAITING";
  q.calledAt = null;
  q.calledBy = null;
  addChangeLog(q, actorName, "คืนคิว", before, {status:"WAITING"}, "กดขึ้นคิวผิดพลาด — คืนคิวกลับไปที่ลำดับเดิม");
  logAudit(actorName, "คืนคิว", `ลำดับ ${q.seq} ถูกคืนกลับไปเป็นคิวที่รอ (แก้ไขจากการกดขึ้นคิวผิดพลาด)`, q.id);
  saveState();
  return {ok:true};
}

function skipQueue(queueId, actorName, reason){
  const q = state.queues.find(x=>x.id===queueId);
  if(!q || q.status!=="WAITING") return {ok:false,msg:"ไม่พบคิวที่รอ"};
  if(!reason || reason.trim().length < 3) return {ok:false,msg:"กรุณาระบุเหตุผลในการข้ามคิว"};
  q.status = "SKIPPED";
  q.completedAt = nowTs();
  q.skipReason = reason.trim();
  addChangeLog(q, actorName, "ข้ามคิว", {status:"WAITING"}, {status:"SKIPPED"}, reason);
  logAudit(actorName, "ข้ามคิว", `ลำดับ ${q.seq} — เหตุผล: ${reason.trim()}`, q.id);
  saveState();
  return {ok:true};
}

/* =========================================================
   CANCEL / EDIT a queue — anti-fraud rule:
   - never hard-remove a row from state.queues (Rule §5)
   - a reason is mandatory for both actions
   - every change is appended to the queue's own changeLog
     AND to the global audit trail, so it is always
     retrospectively reviewable (who/when/what/why)
   ========================================================= */
const STATUS_LABEL_TH = {WAITING:'รอ', SERVING:'กำลังบริการ', COMPLETED:'เสร็จ', SKIPPED:'ข้าม', DELETED:'ยกเลิกแล้ว'};

function addChangeLog(q, actorName, action, before, after, reason){
  q.changeLog = q.changeLog || [];
  q.changeLog.push({ ts: nowTs(), actor: actorName, action, before, after, reason: (reason||'').trim() });
}

function cancelQueue(queueId, actorName, reason){
  const q = state.queues.find(x=>x.id===queueId);
  if(!q) return {ok:false, msg:"ไม่พบคิว"};
  if(q.status==="DELETED") return {ok:false, msg:"คิวนี้ถูกยกเลิกไปแล้ว"};
  if(!reason || reason.trim().length < 3) return {ok:false, msg:"กรุณาพิมพ์เหตุผลในการยกเลิกคิว (อย่างน้อย 3 ตัวอักษร)"};
  const staff = staffById(q.staffId);
  const before = { status:q.status };
  q.priorStatus = q.status; // preserved so history can show what it was before deletion
  q.status = "DELETED";
  q.deletedAt = nowTs();
  q.deletedBy = actorName;
  q.deleteReason = reason.trim();
  addChangeLog(q, actorName, "ยกเลิกคิว", before, {status:"DELETED"}, reason);
  logAudit(actorName, "ยกเลิกคิว", `ลำดับ ${q.seq} (${staff?.name||'-'}) เดิมสถานะ: ${STATUS_LABEL_TH[before.status]||before.status} — เหตุผล: ${reason.trim()}`, q.id);
  saveState();
  return {ok:true};
}

/* Bulk variant: runs cancelQueue for each id and keeps going even if one
   fails (e.g. someone else already served/cancelled it in the meantime),
   so one stale row can't block the rest of the batch. Every ticket still
   gets its own changeLog + audit entry — nothing about the per-ticket
   trail changes, this just drives the same function N times. */
function bulkCancelQueues(queueIds, actorName, reason){
  const okSeqs = [];
  const failed = [];
  queueIds.forEach(id=>{
    const q = state.queues.find(x=>x.id===id);
    const seq = q?.seq;
    const res = cancelQueue(id, actorName, reason);
    if(res.ok) okSeqs.push(seq);
    else failed.push({seq, msg:res.msg});
  });
  return {okCount:okSeqs.length, okSeqs, failed};
}

function editQueueStaff(queueId, newStaffId, actorName, reason){
  const q = state.queues.find(x=>x.id===queueId);
  if(!q) return {ok:false, msg:"ไม่พบคิว"};
  if(q.status==="DELETED") return {ok:false, msg:"ไม่สามารถแก้ไขคิวที่ถูกยกเลิกแล้วได้"};
  if(q.status==="COMPLETED") return {ok:false, msg:"คิวนี้จบแล้ว ไม่สามารถเปลี่ยนพนักงานย้อนหลังได้ (ป้องกันการสลับเครดิตคิว)"};
  if(!reason || reason.trim().length < 3) return {ok:false, msg:"กรุณาระบุเหตุผลในการแก้ไขคิว (อย่างน้อย 3 ตัวอักษร)"};
  const newStaff = staffById(newStaffId);
  if(!newStaff) return {ok:false, msg:"ข้อมูลพนักงานไม่ถูกต้อง"};
  if(newStaffId===q.staffId) return {ok:false, msg:"ยังไม่มีการเปลี่ยนแปลง"};
  if((q.status==="WAITING"||q.status==="SERVING") && staffHasActiveQueue(newStaffId)){
    return {ok:false, msg:`⚠️ ${newStaff.name} มีคิวที่ยังไม่จบอยู่แล้ว`};
  }
  const oldStaff = staffById(q.staffId), oldBrand = brandById(q.brandId);
  const before = { staffId:q.staffId, staffName:oldStaff?.name, brandId:q.brandId, brandName:oldBrand?.name };
  q.staffId = newStaffId;
  q.brandId = newStaff.brandId;
  const after = { staffId:q.staffId, staffName:newStaff.name, brandId:q.brandId, brandName:brandById(q.brandId)?.name };
  addChangeLog(q, actorName, "แก้ไขคิว", before, after, reason);
  logAudit(actorName, "แก้ไขคิว", `ลำดับ ${q.seq}: ${before.staffName} (${before.brandName}) → ${after.staffName} (${after.brandName}) — เหตุผล: ${reason.trim()}`, q.id);
  saveState();
  return {ok:true};
}

/* "แทนคิว" has two flavors, chosen by the reason given:
   - TEMPORARY ("สลับคิวชั่วคราว"): nobody is cancelled. The two
     WAITING tickets simply trade seq numbers — the covering person
     moves up to the earlier position, the original person moves back
     to the covering person's old spot. Both stay WAITING and will be
     called normally when their new position comes up. Use this when
     the original person is expected back and should reclaim a spot.
   - PERMANENT (any other reason): the original ticket is cancelled
     (never hard-deleted, Rule §5) and disappears from the board —
     if that person comes back they must create a brand-new queue
     entry, same as anyone else. The covering person's own ticket
     takes over the vacated seq/position and stays WAITING (it is
     not pushed straight to SERVING).
   Both flavors require a typed reason (same rule as cancelling a
   queue) so the outcome is always traceable in the change log /
   audit trail. */
function validateSubstitution(oldQ, coveringQ, reason){
  if(!oldQ || oldQ.status!=="WAITING") return {ok:false, msg:"ไม่พบคิวที่รออยู่"};
  if(!coveringQ || coveringQ.status!=="WAITING") return {ok:false, msg:"คิวที่จะแทนไม่ได้อยู่ในสถานะรอ"};
  if(coveringQ.id===oldQ.id) return {ok:false, msg:"ไม่สามารถแทนคิวตัวเองได้"};
  if(coveringQ.brandId!==oldQ.brandId) return {ok:false, msg:"แทนคิวได้เฉพาะแบรนด์เดียวกันเท่านั้น"};
  if(!reason || reason.trim().length < 3) return {ok:false, msg:"กรุณาพิมพ์เหตุผลในการแทนคิว (อย่างน้อย 3 ตัวอักษร)"};
  return {ok:true};
}

function substituteQueueSwap(oldQueueId, coveringQueueId, actorName, reason){
  const oldQ = state.queues.find(x=>x.id===oldQueueId);
  const coveringQ = state.queues.find(x=>x.id===coveringQueueId);
  const check = validateSubstitution(oldQ, coveringQ, reason);
  if(!check.ok) return check;

  const oldStaff=staffById(oldQ.staffId), newStaff=staffById(coveringQ.staffId);
  const oldSeqBefore = oldQ.seq, coveringSeqBefore = coveringQ.seq;
  const trimmedReason = reason.trim();

  // Swap positions only — both queues remain WAITING, no status change.
  oldQ.seq = coveringSeqBefore;
  coveringQ.seq = oldSeqBefore;

  addChangeLog(oldQ, actorName, "สลับคิว", {seq:oldSeqBefore}, {seq:oldQ.seq}, trimmedReason);
  addChangeLog(coveringQ, actorName, "สลับคิว", {seq:coveringSeqBefore}, {seq:coveringQ.seq}, trimmedReason);
  logAudit(actorName, "แทนคิว (สลับชั่วคราว)", `สลับตำแหน่งคิว #${oldSeqBefore} (${oldStaff?.name||'-'}) ↔ #${coveringSeqBefore} (${newStaff?.name||'-'}) — เหตุผล: ${trimmedReason}`, oldQ.id);
  saveState();
  return {ok:true, oldSeqBefore, coveringSeqBefore};
}

function substituteQueueReplace(oldQueueId, coveringQueueId, actorName, reason){
  const oldQ = state.queues.find(x=>x.id===oldQueueId);
  const coveringQ = state.queues.find(x=>x.id===coveringQueueId);
  const check = validateSubstitution(oldQ, coveringQ, reason);
  if(!check.ok) return check;

  const oldStaff=staffById(oldQ.staffId), newStaff=staffById(coveringQ.staffId);
  const oldSeqBefore = oldQ.seq, coveringSeqBefore = coveringQ.seq;
  const trimmedReason = reason.trim();

  // Old ticket disappears from the board (cancelled, not hard-deleted).
  const cancelRes = cancelQueue(oldQ.id, actorName, `ถูกแทนคิวโดย ${newStaff?.name||'-'} — ${trimmedReason}`);
  if(!cancelRes.ok) return cancelRes;

  // Covering ticket takes over the vacated position, stays WAITING.
  coveringQ.seq = oldSeqBefore;
  addChangeLog(coveringQ, actorName, "รับช่วงคิว", {seq:coveringSeqBefore}, {seq:coveringQ.seq}, trimmedReason);
  logAudit(actorName, "แทนคิว", `#${oldSeqBefore} (${oldStaff?.name||'-'}) ถูกยกเลิก — ${newStaff?.name||'-'} รับช่วงต่อที่ตำแหน่ง #${oldSeqBefore} (เดิม #${coveringSeqBefore}) — เหตุผล: ${trimmedReason}`, coveringQ.id);
  saveState();
  return {ok:true, oldSeqBefore, coveringSeqBefore};
}

/* =========================================================
   RENDER — board view
   ========================================================= */
function computeStats(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStart = today.getTime();
  const servingNow = state.queues.filter(q=>q.status==="SERVING").length;
  const waitingNow = state.queues.filter(q=>q.status==="WAITING").length;
  const completedToday = state.queues.filter(q=>q.status==="COMPLETED" && q.completedAt>=todayStart).length;
  const waits = state.queues
    .filter(q=>q.calledAt && q.createdAt>=todayStart)
    .map(q=>q.calledAt-q.createdAt);
  const avgWaitMs = waits.length ? waits.reduce((a,b)=>a+b,0)/waits.length : 0;
  return {servingNow, waitingNow, completedToday, avgWaitMs};
}

function renderBoard(root){
  const stats = computeStats();
  const serving = state.queues.filter(q=>q.status==="SERVING").sort((a,b)=>a.calledAt-b.calledAt);
  const waiting = state.queues.filter(q=>q.status==="WAITING").sort((a,b)=>a.seq-b.seq);

  root.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="num">${stats.servingNow}</div><div class="lbl">กำลังบริการ</div></div>
      <div class="stat"><div class="num">${stats.waitingNow}</div><div class="lbl">คิวรอ</div></div>
      <div class="stat"><div class="num">${stats.completedToday}</div><div class="lbl">บริการเสร็จวันนี้</div></div>
      <div class="stat"><div class="num">${stats.avgWaitMs?fmtDuration(stats.avgWaitMs):'—'}</div><div class="lbl">เวลารอเฉลี่ย</div></div>
    </div>

    <section class="serving-row">
      <h2 class="section-title">กำลังบริการ (CURRENTLY SERVING)</h2>
      <div class="serving-cards" id="servingCards"></div>
    </section>

    <div class="board-lower">
      <section class="waiting-section">
        <div class="waiting-head">
          <div class="waiting-head-left">
            <h2 class="section-title" style="margin:0;">คิวที่รอ (WAITING) — เรียงตามลำดับที่ลงคิว</h2>
            ${bulkSelectMode?`<label class="select-all-wrap"><input type="checkbox" id="selectAllWaiting"> เลือกทั้งหมด</label>`:''}
          </div>
          <div class="waiting-head-right">
            ${bulkSelectMode ? `
              <button class="btn-bulk-mode" id="exitBulkModeBtn">✕ ยกเลิกโหมดเลือก</button>
              <button class="btn-bulk-cancel" id="bulkCancelBtn">ยกเลิกที่เลือก (<span id="bulkCancelCount">0</span>)</button>
            ` : `
              <button class="btn-bulk-mode" id="enterBulkModeBtn">ยกเลิกหลายรายการ</button>
            `}
            <button class="btn-board-add" id="boardAddBtn">＋ ลงคิวใหม่</button>
          </div>
        </div>
        <div class="waiting-list" id="waitingList"></div>
      </section>

      <section class="recent-activity">
        <h2 class="section-title">การกระทำล่าสุด (RECENT ACTIVITY)</h2>
        <div class="activity-list" id="activityList"></div>
      </section>
    </div>
  `;

  const boardAddBtn = document.getElementById('boardAddBtn');
  if(boardAddBtn){
    boardAddBtn.disabled = !canWrite();
    boardAddBtn.onclick = ()=>{ if(canWrite()) openAddQueueModal(); };
  }

  const cardsEl = document.getElementById('servingCards');
  if(serving.length===0){
    cardsEl.innerHTML = `<div class="empty-note">ยังไม่มีคิวที่กำลังบริการ</div>`;
  } else {
    serving.forEach(q=>{
      const brand = brandById(q.brandId), staff = staffById(q.staffId);
      const el = document.createElement('div');
      el.className = 'serving-card';
      el.innerHTML = `
        <div class="qno mono">${q.seq}${q.changeLog&&q.changeLog.length?` <span class="mono" style="font-size:11px;color:var(--focus);font-weight:600;">✎${q.changeLog.length}</span>`:''}</div>
        <div class="who">👤 ${staff?.name||'-'}</div>
        <div class="brandline"><span class="swatch" style="background:${brand?.color||'#888'}"></span>${brand?.name||'-'}</div>
        <div class="since">เริ่มบริการ ${fmtClock(q.calledAt)}</div>
        <button class="btn-complete" ${canWrite()?'':'disabled style="opacity:.4;cursor:not-allowed;"'}>✓ จบคิว</button>
        ${canCancelQueue(q)?`<button class="btn-skip" data-return-waiting style="width:100%;margin-top:6px;color:var(--skipped);border-color:var(--skipped);">↩ คืนคิว</button>`:''}
      `;
      el.querySelector('.btn-complete').onclick = ()=>{
        if(!canWrite()) return;
        const actor = staff?.name||'ระบบ';
        const finishedSeq = q.seq;
        completeQueue(q.id, actor);
        // Optional habit-matching flow (settings toggle): mirrors what the
        // department used to do in Notepad — delete the served name, then
        // immediately write it again at the end of the list. Undo-able via
        // the toast in case that particular person is done for the day.
        if(state.settings.autoRequeue){
          const res = createQueue(q.staffId, true);
          render();
          if(res.ok){
            const newQ = res.queue;
            showActionToast(`จบคิว #${finishedSeq} แล้ว — ลงคิวใหม่ #${newQ.seq} ให้ ${staff?.name||'-'} อัตโนมัติ`, ()=>{
              cancelQueue(newQ.id, actor, 'ไม่ลงคิวต่อ');
              render();
            });
          } else {
            showActionToast(`จบคิว #${finishedSeq} แล้ว`);
          }
        } else {
          render();
          showActionToast(`จบคิว #${finishedSeq} แล้ว`);
        }
      };
      const returnBtn = el.querySelector('[data-return-waiting]');
      if(returnBtn){
        returnBtn.disabled = !canWrite();
        returnBtn.onclick = ()=>{
          if(!canWrite()) return;
          const actor = session.role==='ADMIN'?'Admin':(staff?.name||'พนักงานขาย');
          returnQueueToWaiting(q.id, actor);
          render();
        };
      }
      cardsEl.appendChild(el);
    });
  }

  const listEl = document.getElementById('waitingList');
  // prune selections that no longer exist in the current waiting list
  // (ticket got served, cancelled elsewhere, etc.) before rendering checkboxes
  const waitingIds = new Set(waiting.map(q=>q.id));
  Array.from(bulkSelectedIds).forEach(id=>{ if(!waitingIds.has(id)) bulkSelectedIds.delete(id); });

  const updateBulkControls = ()=>{
    const countEl = document.getElementById('bulkCancelCount');
    const btn = document.getElementById('bulkCancelBtn');
    const selectAll = document.getElementById('selectAllWaiting');
    if(countEl) countEl.textContent = bulkSelectedIds.size;
    if(btn) btn.disabled = bulkSelectedIds.size===0 || !canWrite();
    if(selectAll) selectAll.checked = waiting.length>0 && bulkSelectedIds.size===waiting.length;
  };

  if(waiting.length===0){
    listEl.innerHTML = `<div class="empty-note">ไม่มีคิวรอในขณะนี้</div>`;
  } else {
    waiting.forEach(q=>{
      const brand = brandById(q.brandId), staff = staffById(q.staffId);
      const row = document.createElement('div');
      row.className = 'wrow' + (bulkSelectMode?' wrow-bulk':'') + (bulkSelectMode && bulkSelectedIds.has(q.id)?' wrow-selected':'');
      row.innerHTML = `
        ${bulkSelectMode?`<input type="checkbox" class="wchk" ${bulkSelectedIds.has(q.id)?'checked':''} ${canWrite()?'':'disabled'}>`:''}
        <div class="qno mono">${q.seq}${q.changeLog&&q.changeLog.length?` <span style="font-size:11px;color:var(--focus);font-weight:600;">✎${q.changeLog.length}</span>`:''}</div>
        <div class="mid">
          <span class="swatch" style="background:${brand?.color||'#888'}"></span>
          <div>
            <div class="staffname">${staff?.name||'-'}</div>
            <div class="brandname">${brand?.name||'-'}</div>
          </div>
        </div>
        <div class="time mono">${fmtClock(q.createdAt)}</div>
        <div class="wrow-actions"></div>
      `;
      if(bulkSelectMode){
        row.querySelector('.wchk').onchange = (e)=>{
          if(!canWrite()) return;
          if(e.target.checked) bulkSelectedIds.add(q.id); else bulkSelectedIds.delete(q.id);
          row.classList.toggle('wrow-selected', e.target.checked);
          updateBulkControls();
        };
      }
      const actions = row.querySelector('.wrow-actions');
      const callBtn = document.createElement('button');
      callBtn.className = 'btn-call';
      callBtn.textContent = 'ขึ้นคิว';
      callBtn.disabled = !canWrite();
      callBtn.onclick = ()=>{ if(canWrite()){ callQueue(q.id, staff?.name||'ระบบ'); render(); } };
      actions.appendChild(callBtn);

      // Same "จัดการ" menu pattern as the History page: keep the one
      // primary action (ขึ้นคิว) as its own button, tuck the rest away.
      const manageItems = [];
      const sameBrandCandidates = waiting.filter(w=>w.brandId===q.brandId && w.id!==q.id);
      if(sameBrandCandidates.length){
        manageItems.push(`<button class="menu-item" onclick="closeAllManageMenus();if(canWrite())openSubstituteModal('${q.id}')">แทนคิว</button>`);
      }
      if(isSupervisorPlus()){
        manageItems.push(`<button class="menu-item" onclick="closeAllManageMenus();if(canWrite())openSkipModal('${q.id}')">ข้ามคิว</button>`);
        manageItems.push(`<button class="menu-item" onclick="closeAllManageMenus();if(canWrite())openEditModal('${q.id}')">แก้ไขคิว</button>`);
        manageItems.push(`<button class="menu-item danger" onclick="closeAllManageMenus();if(canWrite())openCancelModal('${q.id}')">ยกเลิกคิว</button>`);
      } else if(canCancelQueue(q)){
        manageItems.push(`<button class="menu-item danger" onclick="closeAllManageMenus();if(canWrite())openCancelModal('${q.id}')">ยกเลิกคิว</button>`);
      }
      if(manageItems.length){
        const manageWrap = document.createElement('div');
        manageWrap.className = 'manage-menu';
        manageWrap.innerHTML = `<button class="btn-manage" ${canWrite()?'':'disabled'} onclick="toggleManageMenu(event,'${q.id}')">จัดการ ▾</button><div class="manage-menu-list" id="menu-${q.id}">${manageItems.join('')}</div>`;
        actions.appendChild(manageWrap);
      }
      listEl.appendChild(row);
    });
  }

  updateBulkControls();
  const enterBulkModeBtn = document.getElementById('enterBulkModeBtn');
  if(enterBulkModeBtn){
    enterBulkModeBtn.disabled = !canWrite();
    enterBulkModeBtn.onclick = ()=>{
      if(!canWrite()) return;
      bulkSelectMode = true;
      renderBoard(root);
    };
  }
  const exitBulkModeBtn = document.getElementById('exitBulkModeBtn');
  if(exitBulkModeBtn){
    exitBulkModeBtn.onclick = ()=>{
      bulkSelectMode = false;
      bulkSelectedIds.clear();
      renderBoard(root);
    };
  }
  const selectAllEl = document.getElementById('selectAllWaiting');
  if(selectAllEl){
    selectAllEl.disabled = !canWrite();
    selectAllEl.onchange = (e)=>{
      if(!canWrite()) return;
      if(e.target.checked) waiting.forEach(q=>bulkSelectedIds.add(q.id));
      else bulkSelectedIds.clear();
      renderBoard(root);
    };
  }
  const bulkCancelBtn = document.getElementById('bulkCancelBtn');
  if(bulkCancelBtn){
    bulkCancelBtn.onclick = ()=>{ if(canWrite() && bulkSelectedIds.size>0) openBulkCancelModal(Array.from(bulkSelectedIds)); };
  }

  const activityEl = document.getElementById('activityList');
  // Rule §14 follow-up: the board resets to a new day (seq counter, waiting
  // list) but the audit trail itself is never deleted — so without a date
  // filter here, "Recent Activity" would keep showing yesterday's rows
  // forever. Scope it to today's device-local calendar day only; full
  // history is still always available under History / Audit Log.
  const today = todayKey();
  const recentActivity = (state.audit||[]).filter(a=>todayKey(a.ts)===today).slice(0, 20); // already newest-first (logAudit unshifts)
  if(recentActivity.length===0){
    activityEl.innerHTML = `<div class="empty-note">ยังไม่มีการกระทำวันนี้</div>`;
  } else {
    activityEl.innerHTML = recentActivity.map(a=>`
      <div class="activity-item ${actionClass(a.action)}">
        <div class="a-top">
          <span class="a-who">
            <span class="a-actor">${a.actor||'-'}</span>
            <span class="a-action">${a.action||''}</span>
          </span>
          <span class="a-time mono">${fmtTime(a.ts)}</span>
        </div>
        ${a.detail?`<div class="a-detail">${a.detail}</div>`:''}
      </div>
    `).join('');
  }
}

/* =========================================================
   RENDER — history view (Rule §5: nothing is ever deleted here)
   ========================================================= */
function downloadXLS(filename, headers, rows){
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const html=`<html><head><meta charset="UTF-8"></head><body><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></body></html>`;
  const blob=new Blob(["\ufeff"+html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportHistoryXLS(){
  const rows=[...(state.audit||[])].sort((a,b)=>b.ts-a.ts).map(a=>{
    const q = a.queueId ? state.queues.find(x=>x.id===a.queueId) : null;
    const brand = q ? brandById(q.brandId) : null;
    return [dateLabelTH(a.ts),fmtTime(a.ts),a.actor||'',a.action||'',q?`#${q.seq}`:'',brand?.name||'',a.detail||''];
  });
  downloadXLS(`paint-queue-history-${new Date().toISOString().slice(0,10)}.xls`,['วันที่','เวลา','ผู้ทำรายการ','การกระทำ','ลำดับคิว','แบรนด์','รายละเอียด'],rows);
}
function exportAuditXLS(){
  const rows=[...(state.audit||[])].sort((a,b)=>b.ts-a.ts).map(a=>[fmtTime(a.ts),a.actor||'',a.action||'',a.detail||'']);
  downloadXLS(`paint-queue-audit-${new Date().toISOString().slice(0,10)}.xls`,['เวลา','ผู้ทำรายการ','การดำเนินการ','รายละเอียด'],rows);
}

/* Rule §14 follow-up: since seqCounter resets every day, the same #
   (e.g. #1, #5) exists once per day — History needs a date filter and
   a date badge on every ticket so old and new "#1"s are never confused. */
function dateLabelTH(ts){
  return new Date(ts).toLocaleDateString('th-TH', {day:'numeric', month:'short'});
}
/* Fix: the #seq resets to 1 every day (Rule §14), so "#5" alone is
   ambiguous once History spans more than one day. Every ticket now
   carries its date in the SAME visual weight as the number (not a
   faded afterthought chip), plus a color tied to that specific date —
   so two "#5" tickets from different days are never mistaken for one
   another, even scrolling fast or after a search. */
const DAY_COLOR_PALETTE = ['#2563EB','#059669','#D97706','#DB2777','#7C3AED','#0891B2','#DC2626','#65A30D'];
function dayColorFor(dateKey){
  let hash = 0;
  for(let i=0;i<dateKey.length;i++) hash = (hash*31 + dateKey.charCodeAt(i)) >>> 0;
  return DAY_COLOR_PALETTE[hash % DAY_COLOR_PALETTE.length];
}
// Every entry a person can filter History by, mapped to the same
// act-* accent used in Recent Activity, so the two views read consistently.
const HISTORY_TYPE_FILTERS = [
  {cls:'act-create', label:'ลงคิว'},
  {cls:'act-serving', label:'เริ่มบริการ'},
  {cls:'act-done', label:'จบคิว'},
  {cls:'act-return', label:'คืนคิว'},
  {cls:'act-skip', label:'ข้ามคิว'},
  {cls:'act-cancel', label:'ยกเลิกคิว'},
  {cls:'act-edit', label:'แก้ไขคิว'},
  {cls:'act-swap', label:'แทนคิว'},
  {cls:'act-admin', label:'อื่นๆ / ระบบ'},
];
function renderHistory(root){
  // History now shows every action of each day (not one card per ticket) —
  // state.audit is already a flat, never-trimmed log of every action taken
  // (Rule §5), so it is the source of truth for this view.
  const dateKeys = Array.from(new Set((state.audit||[]).map(a=>todayKey(a.ts)))).sort((a,b)=>b.localeCompare(a));

  root.innerHTML = `
    <div class="toolbar">
      <button class="btn-export" id="exportHistoryBtn">⇩ Export XLS</button>
      <input type="text" id="histSearch" placeholder="ค้นหาผู้ทำรายการ / ลำดับ / รายละเอียด">
      <select id="histDate"><option value="">ทุกวัน</option></select>
      <select id="histType">
        <option value="">ทุกประเภทการกระทำ</option>
        ${HISTORY_TYPE_FILTERS.map(t=>`<option value="${t.cls}">${t.label}</option>`).join('')}
      </select>
    </div>
    <div id="historyTimeline"></div>
  `;
  const dateSel = document.getElementById('histDate');
  const today = todayKey();
  dateKeys.forEach(k=>{
    const o = document.createElement('option'); o.value=k;
    const sample = (state.audit||[]).find(a=>todayKey(a.ts)===k);
    o.textContent = dateLabelTH(sample.ts) + (k===today ? ' (วันนี้)' : '');
    dateSel.appendChild(o);
  });

  function actionItemHtml(a, rowKey){
    const cls = actionClass(a.action);
    const q = a.queueId ? state.queues.find(x=>x.id===a.queueId) : null;
    let badge = '';
    if(q){
      const brand = brandById(q.brandId);
      const swatch = brand ? `<span class="swatch" style="background:${brand.color};width:8px;height:8px;display:inline-block;margin-right:4px;border-radius:2px;"></span>` : '';
      badge = `<span class="haction-badge">${swatch}#${q.seq}${brand?` · ${brand.name}`:''}</span>`;
    }
    // Manage actions still live per-ticket (edit/cancel/view edit-log), so
    // a supervisor can act directly from the day feed on whichever ticket
    // an action row refers to — same permission rules as before.
    let manage = '';
    if(q){
      const hasLog = q.changeLog && q.changeLog.length && isSupervisorPlus();
      const canManage = isSupervisorPlus() && q.status!=='DELETED';
      const canEditStaff = canManage && q.status!=='COMPLETED';
      const items = [];
      if(hasLog) items.push(`<button class="menu-item" onclick="closeAllManageMenus();openLogModal('${q.id}')">🕘 ประวัติการแก้ไข (${q.changeLog.length})</button>`);
      if(canManage){
        if(canEditStaff) items.push(`<button class="menu-item" onclick="closeAllManageMenus();openEditModal('${q.id}')">แก้ไข</button>`);
        items.push(`<button class="menu-item danger" onclick="closeAllManageMenus();openCancelModal('${q.id}')">ยกเลิก</button>`);
      } else if(session.role==='STAFF' && q.status!=='DELETED'){
        items.push(`<button class="menu-item danger" onclick="closeAllManageMenus();openCancelModal('${q.id}')">ยกเลิก</button>`);
      }
      if(items.length){
        manage = `<div class="haction-foot"><div class="manage-menu"><button class="btn-manage" onclick="toggleManageMenu(event,'${rowKey}')">จัดการ ▾</button><div class="manage-menu-list" id="menu-${rowKey}">${items.join('')}</div></div></div>`;
      }
    }
    return `<div class="haction-item ${cls}">
      <div class="haction-top">
        <div class="haction-who">
          <span class="haction-actor">${a.actor||'-'}</span>
          <span class="haction-action">${a.action||''}</span>
          ${badge}
        </div>
        <span class="haction-time mono">${fmtTime(a.ts)}</span>
      </div>
      ${a.detail?`<div class="haction-detail">${a.detail}</div>`:''}
      ${manage}
    </div>`;
  }

  function draw(){
    const term = document.getElementById('histSearch').value.trim().toLowerCase();
    const typeF = document.getElementById('histType').value;
    const dateF = document.getElementById('histDate').value;
    const filtersActive = !!(term || typeF || dateF);
    const rows = [...(state.audit||[])]
      .sort((a,b)=>b.ts-a.ts)
      .filter(a=>{
        if(dateF && todayKey(a.ts)!==dateF) return false;
        if(typeF && actionClass(a.action)!==typeF) return false;
        if(term){
          const q = a.queueId ? state.queues.find(x=>x.id===a.queueId) : null;
          const hay = `${a.actor||''} ${a.action||''} ${a.detail||''} ${q?q.seq:''}`.toLowerCase();
          if(!hay.includes(term)) return false;
        }
        return true;
      });
    const list = document.getElementById('historyTimeline');
    if(!rows.length){
      list.innerHTML = filtersActive
        ? `<div class="empty-note">ไม่พบการกระทำที่ตรงกับตัวกรองที่เลือก <button class="btn-ghost" id="clearFiltersBtn">ล้างตัวกรอง</button></div>`
        : `<div class="empty-note">ยังไม่มีการกระทำในระบบ</div>`;
      if(filtersActive){
        document.getElementById('clearFiltersBtn').onclick = ()=>{
          document.getElementById('histSearch').value='';
          document.getElementById('histType').value='';
          document.getElementById('histDate').value='';
          draw();
        };
      }
      return;
    }

    // Sticky date-group headers, same as before, but now each group holds
    // every action of that day rather than one card per ticket.
    let html = '';
    let lastKey = null;
    let dayCount = 0;
    rows.forEach((a, i)=>{
      const dk = todayKey(a.ts);
      if(dk !== lastKey){
        lastKey = dk;
        const dc = dayColorFor(dk);
        dayCount = rows.filter(r=>todayKey(r.ts)===dk).length;
        html += `<div class="hist-date-header" style="--day-color:${dc}"><span class="hist-date-dot"></span>${dateLabelTH(a.ts)}${dk===today?' (วันนี้)':''} <span class="history-day-count">— ${dayCount} การกระทำ</span></div>`;
      }
      html += actionItemHtml(a, 'h'+i);
    });
    list.innerHTML = html;
  }
  document.getElementById('histSearch').oninput=draw;
  document.getElementById('exportHistoryBtn').onclick=exportHistoryXLS;
  document.getElementById('histDate').onchange=draw;
  document.getElementById('histType').onchange=draw;
  draw();
}

function resetQueuesWithPin(pin){
  if(String(pin)!=="1425") return {ok:false,msg:"PIN ไม่ถูกต้อง"};
  const active = state.queues.filter(q=>q.status==="WAITING"||q.status==="SERVING").length;
  state.queues.forEach(q=>{ if(q.status==="WAITING"||q.status==="SERVING"){
    q.priorStatus = q.status; q.status="DELETED"; q.deletedAt=nowTs(); q.deletedBy="Admin"; q.deleteReason="รีเซ็ตคิว";
    addChangeLog(q,"Admin","รีเซ็ตคิว",{status:q.priorStatus},{status:"DELETED"},"รีเซ็ตคิว");
  }});
  state.seqCounter = 0;
  logAudit("Admin","รีเซ็ตคิว",`ล้างคิวที่ยังไม่จบ ${active} คิว และเริ่มเลขคิวใหม่จาก 1`);
  saveState();
  return {ok:true,active};
}

/* Step-reduction fix: every cancel/skip/edit/substitute/create used to
   end by forcing the person to tap an extra "ตกลง" button on a full
   success screen before they could do anything else. That's one wasted
   tap on every single action, all day. Now the working modal closes the
   instant the action is confirmed, and this toast just confirms what
   happened — auto-dismissing, with an "เลิกทำ" (undo) link when relevant. */
function showActionToast(msg, undo){
  const el = document.getElementById('actionToast');
  if(!el) return;
  el.innerHTML = `<span style="flex:1;">✓ ${msg}</span>` + (undo ? `<button class="toast-undo" id="toastUndoBtn">เลิกทำ</button>` : '');
  el.classList.add('show');
  clearTimeout(showActionToast._t);
  showActionToast._t = setTimeout(()=>el.classList.remove('show'), undo ? 6000 : 3500);
  if(undo){
    document.getElementById('toastUndoBtn').onclick = ()=>{ undo(); el.classList.remove('show'); };
  }
}
