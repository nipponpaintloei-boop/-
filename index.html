      const res=resetQueuesWithPin(document.getElementById('resetPin').value);
      if(!res.ok){document.getElementById('modalError').textContent=res.msg;return;}
      closeModal();render();
    };
    return;
  }

  // Bulk-cancel flow also has no single queueId (it carries an ids array),
  // so it's handled here too, before the single-queue lookup below.
  if(manageFlow && manageFlow.type==='bulk-cancel'){
    const targets = manageFlow.ids.map(id=>state.queues.find(x=>x.id===id)).filter(Boolean);
    if(targets.length===0){ closeModal(); return; }
    const rowsHtml = targets.map(t=>{
      const st = staffById(t.staffId), br = brandById(t.brandId);
      return `<div style="font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);"><strong>#${t.seq}</strong> — ${st?.name||'-'} · ${br?.name||'-'}</div>`;
    }).join('');
    body.innerHTML = `
      <h3>ยกเลิกคิวที่เลือก (${targets.length} รายการ)</h3>
      <div class="step-note">คิวทั้งหมดด้านล่างจะถูกยกเลิกด้วยเหตุผลเดียวกัน และยังคงปรากฏใน "ประวัติ" และ "Audit Log" เสมอ เพื่อป้องกันการโกง/ทุจริตคิว</div>
      <div style="max-height:160px;overflow-y:auto;margin-bottom:10px;">${rowsHtml}</div>
      <div>เหตุผลในการยกเลิก (จำเป็น) :</div>
      <select id="reasonPreset" class="reason-select">
        <option value="">— เลือกเหตุผล —</option>
        <option>กินข้าว</option>
        <option>ยืนข้างหน้า</option>
        <option>ลงคิวผิด</option>
        <option>ยืนแทนคิว</option>
        <option>ไม่อยู่ในแผนก</option>
        <option>ไม่รับคิว</option>
        <option>เปลี่ยนฝั่งยืน</option>
        <option value="OTHER">อื่นๆ (ระบุเอง)</option>
      </select>
      <textarea id="reasonInput" rows="3" ${REASON_BOX} placeholder="เลือกเหตุผล หรือพิมพ์เหตุผลเพิ่มเติม..."></textarea>
      <div class="error-msg" id="modalError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
        <button class="btn-primary" id="confirmBtn" style="background:var(--danger);color:#fff;">ยืนยันยกเลิก ${targets.length} คิว</button>
      </div>
    `;
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('confirmBtn').onclick = ()=>{
      const preset = document.getElementById('reasonPreset').value;
      const typed = document.getElementById('reasonInput').value.trim();
      const reason = preset === 'OTHER' ? typed : (typed ? `${preset} — ${typed}` : preset);
      if(!reason || reason.trim().length < 3){ document.getElementById('modalError').textContent = 'กรุณาพิมพ์เหตุผลในการยกเลิกคิว (อย่างน้อย 3 ตัวอักษร)'; return; }
      const actor = session.role==='ADMIN'?'Admin':'พนักงานขาย';
      const res = bulkCancelQueues(manageFlow.ids, actor, reason);
      bulkSelectedIds.clear();
      bulkSelectMode = false;
      closeModal(); render();
      if(res.failed.length===0){
        showSuccess('ยกเลิกคิวสำเร็จ', `ยกเลิก ${res.okCount} คิว (#${res.okSeqs.join(', #')}) และบันทึกไว้ในประวัติเรียบร้อยแล้ว`);
      } else {
        showSuccess('ยกเลิกคิวสำเร็จบางส่วน', `สำเร็จ ${res.okCount} คิว — ไม่สำเร็จ ${res.failed.length} คิว (อาจถูกจัดการไปแล้วก่อนหน้า)`);
      }
    };
    return;
  }

  const q = state.queues.find(x=>x.id===manageFlow.queueId);
  if(!q){ closeModal(); return; }
  const staff = staffById(q.staffId), brand = brandById(q.brandId);

  if(manageFlow.type==='cancel'){
    body.innerHTML = `
      <h3>ยกเลิกคิว #${q.seq}</h3>
      <div class="step-note">${staff?.name||'-'} · ${brand?.name||'-'} · สถานะปัจจุบัน: ${STATUS_LABEL_TH[q.status]||q.status}<br>
      การยกเลิกจะยังคงปรากฏใน "ประวัติ" และ "Audit Log" เสมอ เพื่อป้องกันการโกง/ทุจริตคิว</div>
      <div>เหตุผลในการยกเลิก (จำเป็น) :</div>
      <select id="reasonPreset" class="reason-select">
        <option value="">— เลือกเหตุผล —</option>
        <option>กินข้าว</option>
        <option>ยืนข้างหน้า</option>
        <option>ลงคิวผิด</option>
        <option>ยืนแทนคิว</option>
        <option>ไม่อยู่ในแผนก</option>
        <option>ไม่รับคิว</option>
        <option>เปลี่ยนฝั่งยืน</option>
        <option value="OTHER">อื่นๆ (ระบุเอง)</option>
      </select>
      <textarea id="reasonInput" rows="3" ${REASON_BOX} placeholder="เลือกเหตุผล หรือพิมพ์เหตุผลเพิ่มเติม..."></textarea>
      <div class="error-msg" id="modalError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
        <button class="btn-primary" id="confirmBtn" style="background:var(--danger);color:#fff;">ยืนยันยกเลิกคิว</button>
      </div>
    `;
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('confirmBtn').onclick = ()=>{
      const preset = document.getElementById('reasonPreset').value;
      const typed = document.getElementById('reasonInput').value.trim();
      const reason = preset === 'OTHER' ? typed : (typed ? `${preset} — ${typed}` : preset);
      const actor = session.role==='ADMIN'?'Admin':(staff?.name||'พนักงานขาย');
      const res = cancelQueue(q.id, actor, reason);
      if(!res.ok){ document.getElementById('modalError').textContent = res.msg; return; }
      closeModal(); render(); showSuccess('ยกเลิกคิวสำเร็จ', `คิว #${q.seq} ถูกยกเลิกและบันทึกไว้ในประวัติเรียบร้อยแล้ว`);
    };
  }

  else if(manageFlow.type==='skip'){
    body.innerHTML = `
      <h3>ข้ามคิว #${q.seq}</h3>
      <div class="step-note">${staff?.name||'-'} · ${brand?.name||'-'} · การข้ามคิวจะถูกบันทึกในประวัติและ Audit Log</div>
      <div>เหตุผลในการข้ามคิว (จำเป็น) :</div>
      <select id="reasonPreset" class="reason-select">
        <option value="">— เลือกเหตุผล —</option>
        <option>ไม่อยู่ในแผนก</option>
        <option>ไม่รับคิว</option>
        <option value="OTHER">อื่นๆ (ระบุเอง)</option>
      </select>
      <textarea id="reasonInput" rows="3" ${REASON_BOX} placeholder="เลือกเหตุผล หรือพิมพ์เหตุผลเพิ่มเติม..."></textarea>
      <div class="error-msg" id="modalError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
        <button class="btn-primary" id="confirmBtn">ยืนยันข้ามคิว</button>
      </div>`;
    document.getElementById('cancelBtn').onclick=closeModal;
    document.getElementById('confirmBtn').onclick=()=>{
      const preset=document.getElementById('reasonPreset').value;
      const typed=document.getElementById('reasonInput').value.trim();
      const reason=preset==='OTHER'?typed:(typed?`${preset} — ${typed}`:preset);
      const actor=session.role==='ADMIN'?'Admin':(staff?.name||'พนักงานขาย');
      const res=skipQueue(q.id,actor,reason);
      if(!res.ok){document.getElementById('modalError').textContent=res.msg;return;}
      closeModal(); render(); showSuccess('ข้ามคิวสำเร็จ',`คิว #${q.seq} ถูกข้ามและบันทึกเหตุผลเรียบร้อยแล้ว`);
    };
  }

  else if(manageFlow.type==='edit' && manageFlow.step===1){
    body.innerHTML = `
      <h3>แก้ไขคิว #${q.seq}</h3>
      <div class="step-note">ปัจจุบัน: ${staff?.name||'-'} (${brand?.name||'-'}) — เลือกพนักงานที่ถูกต้อง</div>
      <div class="grid-pick" id="staffPick"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
      </div>
    `;
    const pick = document.getElementById('staffPick');
    state.staff.filter(s=>s.id!==q.staffId).forEach(s=>{
      const locked = (q.status==="WAITING"||q.status==="SERVING") && staffHasActiveQueue(s.id);
      const b = brandById(s.brandId);
      const btn = document.createElement('button');
      btn.className = 'pick-btn' + (locked?' locked':'');
      btn.innerHTML = `
        <span class="swatch" style="background:${b?.color||'#888'}"></span>
        <span>
          <div>${s.name}${locked?' <span style="font-size:11px;color:var(--skipped);">(มีคิวค้าง)</span>':''}</div>
          <div class="staff-brand">${b?.name||'-'}</div>
        </span>`;
      btn.disabled = locked;
      btn.onclick = ()=>{ manageFlow.newStaffId = s.id; manageFlow.step = 2; renderManageModal(); };
      pick.appendChild(btn);
    });
    document.getElementById('cancelBtn').onclick = closeModal;
  }

  else if(manageFlow.type==='edit' && manageFlow.step===2){
    const newStaff = staffById(manageFlow.newStaffId), newBrand = brandById(newStaff?.brandId);
    body.innerHTML = `
      <h3>ยืนยันการแก้ไขคิว #${q.seq}</h3>
      <div class="confirm-summary">
        <div>เดิม: <strong>${staff?.name} (${brand?.name})</strong></div>
        <div>เปลี่ยนเป็น: <strong>${newStaff?.name} (${newBrand?.name})</strong></div>
      </div>
      <div>เหตุผลในการแก้ไข (จำเป็น) :</div>
      <select id="reasonPreset" class="reason-select">
        <option value="">— เลือกเหตุผล —</option>
        <option>ลงคิวผิด</option>
        <option>ยืนแทนคิว</option>
        <option value="OTHER">อื่นๆ (ระบุเอง)</option>
      </select>
      <textarea id="reasonInput" rows="3" ${REASON_BOX} placeholder="เลือกเหตุผล หรือพิมพ์เหตุผลเพิ่มเติม..."></textarea>
      <div class="error-msg" id="modalError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="backBtn">ย้อนกลับ</button>
        <button class="btn-primary" id="confirmBtn">ยืนยันแก้ไข</button>
      </div>
    `;
    document.getElementById('backBtn').onclick = ()=>{ manageFlow.step=1; renderManageModal(); };
    document.getElementById('confirmBtn').onclick = ()=>{
      const preset = document.getElementById('reasonPreset').value;
      const typed = document.getElementById('reasonInput').value.trim();
      const reason = preset === 'OTHER' ? typed : (typed ? `${preset} — ${typed}` : preset);
      const actor = session.role==='ADMIN'?'Admin':(staff?.name||'พนักงานขาย');
      const res = editQueueStaff(q.id, manageFlow.newStaffId, actor, reason);
      if(!res.ok){ document.getElementById('modalError').textContent = res.msg; return; }
      closeModal(); render(); showSuccess('แก้ไขคิวสำเร็จ', `คิว #${q.seq} ถูกแก้ไขและบันทึกประวัติเรียบร้อยแล้ว`);
    };
  }

  else if(manageFlow.type==='substitute'){
    // Same-brand WAITING tickets only — someone from a different brand
    // has no business jumping in to cover this one.
    const candidates = state.queues.filter(x=>x.status==='WAITING' && x.brandId===q.brandId && x.id!==q.id);
    if(!manageFlow.coveringId){
      body.innerHTML = `
        <h3>แทนคิว #${q.seq}</h3>
        <div class="step-note">${staff?.name||'-'} · ${brand?.name||'-'} — เลือกพนักงานแบรนด์เดียวกันที่จะแทนคิวนี้<br>ปกติคิว #${q.seq} จะถูกยกเลิกและหายไปจากบอร์ด (${staff?.name||'-'} ต้องลงคิวใหม่ทีหลัง) — ยกเว้นเลือกเหตุผล "สลับคิวชั่วคราว" ซึ่งจะแค่สลับตำแหน่งกันเฉยๆ ไม่มีใครถูกยกเลิก</div>
        <div class="grid-pick" id="subPick"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
        </div>
      `;
      const pick = document.getElementById('subPick');
      if(!candidates.length){
        pick.innerHTML = `<div class="empty-note">ไม่มีคิวที่รออยู่ในแบรนด์เดียวกันให้แทน</div>`;
      } else {
        candidates.forEach(c=>{
          const cs = staffById(c.staffId);
          const btn = document.createElement('button');
          btn.className = 'pick-btn';
          btn.innerHTML = `<span class="swatch" style="background:${brand?.color||'#888'}"></span><span><div>${cs?.name||'-'}</div><div class="staff-brand">คิว #${c.seq}</div></span>`;
          btn.onclick = ()=>{ manageFlow.coveringId = c.id; renderManageModal(); };
          pick.appendChild(btn);
        });
      }
      document.getElementById('cancelBtn').onclick = closeModal;
    } else {
      const coveringQ = state.queues.find(x=>x.id===manageFlow.coveringId);
      const coveringStaff = staffById(coveringQ?.staffId);
      const SWAP_REASON = 'สลับคิวชั่วคราว';
      const previewHtml = (isSwap)=> isSwap ? `
          <div>คิว #${q.seq} (<strong>${staff?.name||'-'}</strong>) จะเปลี่ยนเป็นตำแหน่ง #${coveringQ?.seq}</div>
          <div>คิว #${coveringQ?.seq} (<strong>${coveringStaff?.name||'-'}</strong>) จะเปลี่ยนเป็นตำแหน่ง #${q.seq}</div>
          <div style="margin-top:6px;color:var(--ink-faint);">สลับชั่วคราว — ทั้งสองคิวยังคงเป็นสถานะ "รอ" เหมือนเดิม แค่สลับตำแหน่งกัน</div>
        ` : `
          <div>คิว #${q.seq} (<strong>${staff?.name||'-'}</strong>) จะถูก<strong style="color:var(--danger);">ยกเลิกและหายไปจากบอร์ด</strong></div>
          <div>คิว #${coveringQ?.seq} (<strong>${coveringStaff?.name||'-'}</strong>) จะรับช่วงต่อที่ตำแหน่ง #${q.seq}</div>
          <div style="margin-top:6px;color:var(--ink-faint);">${staff?.name||'-'} ต้องลงคิวใหม่เมื่อกลับมา</div>
        `;
      body.innerHTML = `
        <h3>ยืนยันแทนคิว</h3>
        <div class="confirm-summary" id="subPreview">${previewHtml(false)}</div>
        <div>เหตุผลในการแทนคิว (จำเป็น) :</div>
        <select id="reasonPreset" class="reason-select">
          <option value="">— เลือกเหตุผล —</option>
          <option>ยืนแทนคิว</option>
          <option>${SWAP_REASON}</option>
          <option value="OTHER">อื่นๆ (ระบุเอง)</option>
        </select>
        <textarea id="reasonInput" rows="3" ${REASON_BOX} placeholder="เลือกเหตุผล หรือพิมพ์เหตุผลเพิ่มเติม..."></textarea>
        <div class="error-msg" id="modalError"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="backBtn">ย้อนกลับ</button>
          <button class="btn-primary" id="confirmBtn">ยืนยันแทนคิว</button>
        </div>
      `;
      document.getElementById('reasonPreset').onchange = (e)=>{
        document.getElementById('subPreview').innerHTML = previewHtml(e.target.value===SWAP_REASON);
      };
      document.getElementById('backBtn').onclick = ()=>{ manageFlow.coveringId=null; renderManageModal(); };
      document.getElementById('confirmBtn').onclick = ()=>{
        const preset = document.getElementById('reasonPreset').value;
        const typed = document.getElementById('reasonInput').value.trim();
        const reason = preset === 'OTHER' ? typed : (typed ? `${preset} — ${typed}` : preset);
        const actor = session.role==='ADMIN'?'Admin':(staff?.name||'พนักงานขาย');
        const oldSeqBefore = q.seq, coveringSeqBefore = coveringQ.seq;
        const isSwap = preset === SWAP_REASON;
        const res = isSwap
          ? substituteQueueSwap(q.id, manageFlow.coveringId, actor, reason)
          : substituteQueueReplace(q.id, manageFlow.coveringId, actor, reason);
        if(!res.ok){ document.getElementById('modalError').textContent = res.msg; return; }
        if(isSwap){
          closeModal(); render(); showSuccess('สลับคิวสำเร็จ', `${staff?.name||'-'} ได้คิว #${coveringSeqBefore} และ ${coveringStaff?.name||'-'} ได้คิว #${oldSeqBefore} แล้ว`);
        } else {
          closeModal(); render(); showSuccess('แทนคิวสำเร็จ', `คิว #${oldSeqBefore} ถูกยกเลิกแล้ว — ${coveringStaff?.name||'-'} รับช่วงต่อที่ตำแหน่ง #${oldSeqBefore}`);
        }
      };
    }
  }

  else if(manageFlow.type==='log'){
    const logs = (q.changeLog||[]).slice().reverse();
    body.innerHTML = `
      <h3>ประวัติการเปลี่ยนแปลง — คิว #${q.seq}</h3>
      <div class="step-note">ทุกการแก้ไข/ลบของคิวนี้ ตรวจสอบย้อนหลังได้เสมอ ไม่มีการลบทิ้งจริง</div>
      <div id="logList" style="max-height:52vh;overflow-y:auto;"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">ปิด</button>
      </div>
    `;
    const listEl = document.getElementById('logList');
    if(logs.length===0){
      listEl.innerHTML = `<div class="empty-note">ยังไม่มีการแก้ไข</div>`;
    } else {
      listEl.innerHTML = logs.map(l=>{
        let changeDesc = '';
        if(l.action==='แก้ไขคิว'){
          changeDesc = `${l.before?.staffName||'-'} (${l.before?.brandName||'-'}) → ${l.after?.staffName||'-'} (${l.after?.brandName||'-'})`;
        } else if(l.action==='ยกเลิกคิว'){
          changeDesc = `สถานะเดิม: ${STATUS_LABEL_TH[l.before?.status]||l.before?.status||'-'} → ยกเลิกแล้ว`;
        } else if(l.action==='คืนคิว'){
          changeDesc = `สถานะเดิม: ${STATUS_LABEL_TH[l.before?.status]||l.before?.status||'-'} → กลับมาเป็นคิวที่รอ`;
        } else if(l.action==='สลับคิว'){
          changeDesc = `ตำแหน่งคิว #${l.before?.seq} → #${l.after?.seq}`;
        } else if(l.action==='รับช่วงคิว'){
          changeDesc = `รับช่วงต่อ — ตำแหน่งคิว #${l.before?.seq} → #${l.after?.seq}`;
        }
        return `<div class="audit-line">
          <span class="ts mono">${fmtTime(l.ts)}</span><strong>${l.actor}</strong> — ${l.action}<br>
          <span class="mono">${changeDesc}</span><br>
          <span style="color:var(--ink-faint);">เหตุผล: ${l.reason||'-'}</span>
        </div>`;
      }).join('');
    }
    document.getElementById('cancelBtn').onclick = closeModal;
  }
}

function renderModal(){
  const body = document.getElementById('modalBody');

  if(addFlow.step===1){
    body.innerHTML = `
      <h3>เลือกพนักงาน</h3>
      <div class="step-note">แตะชื่อของคุณเพื่อลงคิวทันที</div>
      <div class="grid-pick" id="staffPick"></div>
      <div class="error-msg" id="modalError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
      </div>
    `;
    const pick = document.getElementById('staffPick');
    state.staff.forEach(s=>{
      const locked = staffHasActiveQueue(s.id);
      const brand = brandById(s.brandId);
      const btn = document.createElement('button');
      btn.className = 'pick-btn' + (locked?' locked':'');
      btn.innerHTML = `
        <span class="swatch" style="background:${brand?.color||'#888'}"></span>
        <span>
          <div>${s.name}${locked?' <span style="font-size:11px;color:var(--skipped);">(มีคิวค้าง)</span>':''}</div>
          <div class="staff-brand">${brand?.name||'-'}</div>
        </span>`;
      btn.disabled = locked;
      // Step-reduction fix: used to be pick → confirm → success (3 taps).
      // A name in this grid is already a deliberate choice, so create the
      // queue immediately and give an "เลิกทำ" undo window instead of
      // making everyone tap through a redundant confirm screen first.
      btn.onclick = ()=>{
        const res = createQueue(s.id);
        if(!res.ok){ document.getElementById('modalError').textContent = res.msg; return; }
        const q = res.queue;
        closeModal();
        render();
        showActionToast(`ลงคิว #${q.seq} ให้ ${s.name} แล้ว`, ()=>{
          cancelQueue(q.id, session.role==='ADMIN'?'Admin':s.name, 'ลงคิวผิด');
          render();
        });
      };
      pick.appendChild(btn);
    });
    document.getElementById('cancelBtn').onclick = closeModal;
  }
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  renderChrome();
  const root = document.getElementById('viewRoot');
  if(session.tab==="board") renderBoard(root);
  else if(session.tab==="history") renderHistory(root);
  else if(session.tab==="audit" && isSupervisorPlus()) renderAudit(root);
  else if(session.tab==="admin" && isAdmin()) renderAdmin(root);
  else renderBoard(root);
}

// auto-refresh so served-since / stats stay live even without user action
setInterval(()=>{ if(session.tab==="board") renderBoard(document.getElementById('viewRoot')); }, 15000);
// re-check device gate on resize/rotation
window.addEventListener('resize', render);

/* Rule §14 — check for a day-change every time the app opens (already done
   once below, before the first render), AND every minute while the tab is
   left open, so a device left running overnight still resets itself the
   moment midnight passes, with no manual "Reset" click required. Also
   re-check whenever the tab regains focus/visibility, which covers phones
   or PCs that were asleep and just woke up on a new day. */
(function(){
  const info = performDailyResetIfNeeded();
  if(info) showDailyResetToast(info);
})();
setInterval(()=>{
  const info = performDailyResetIfNeeded();
  if(info){ render(); showDailyResetToast(info); }
}, 60000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  const info = performDailyResetIfNeeded();
  if(info){ render(); showDailyResetToast(info); }
});

render();
</script>
</body>
